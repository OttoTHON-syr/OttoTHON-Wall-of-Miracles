# Decap CMS configuration. Docs: https://decapcms.org/docs/configuration-options/
# Setup steps for sign-in (editors use Google) are in docs/ADMIN-SETUP.md.

backend:
  name: github
  repo: ottothon-syr/OttoTHON-Wall-of-Miracles   # change if the repository moves (for example to an organization)
  branch: main
  base_url: https://ottothon-editor-auth.daniellelawton8.workers.dev  # TODO: the address of cloudflare/editor-auth once deployed (docs/ADMIN-SETUP.md). No trailing slash.

# Every change becomes a draft first, so someone can review before it goes live.
publish_mode: editorial_workflow

# Run "npx decap-server" next to "python3 -m http.server" to edit locally without signing in.
local_backend: true

media_folder: assets/uploads
public_folder: assets/uploads

site_url: https://ottothon-syr.github.io/OttoTHON-Wall-of-Miracles
display_url: https://ottothon-syr.github.io/OttoTHON-Wall-of-Miracles
locale: en

collections:
  - name: kids
    label: "Miracle kids"
    description: "The kids on the Wall of Miracles wheel. Drag to reorder: the order here is the order on the wheel. Only enter a child once the family has approved, because this repository is public."
    files:
      - name: kids
        label: "Miracle kids"
        file: content/kids.json
        fields:
          - label: "Miracle kids"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
                hint: "First name and last initial only, as the family approved."
              - label: "With OttoTHON since"
                name: "since"
                widget: "string"
                hint: "A year, for example 2022."
                required: false
              - label: "One-line intro"
                name: "tagline"
                widget: "string"
                required: false
              - label: "Story"
                name: "story"
                widget: "text"
                hint: "Use the family-approved text. Leave out medical details and last names."
              - label: "Photo"
                name: "photo"
                widget: "focusimage"
                hint: "Choose the photo, then drag the box that appears over the part that should always stay in view. Use only photos the family approved."
                required: false
              - label: "Family consent and photo approval confirmed in writing"
                name: "approved"
                widget: "boolean"
                hint: "This must be ticked or the entry stays hidden, even if “Show on the site” is on."
                default: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: stories
    label: "Success stories"
    description: "Moments shared on the Wall of Miracles. Only enter a story once the family has approved."
    files:
      - name: stories
        label: "Success stories"
        file: content/stories.json
        fields:
          - label: "Success stories"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Hospital moments", "Family", "Community", "Fundraiser"]
                default: "Community"
              - label: "Date of the moment"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Short caption"
                name: "summary"
                widget: "string"
                hint: "Shows on the card before someone opens the story."
                required: false
              - label: "Story"
                name: "story"
                widget: "text"
                hint: "Use the family-approved text. Leave out medical details and last names."
              - label: "Photo"
                name: "photo"
                widget: "focusimage"
                hint: "Choose the photo, then drag the box that appears over the part that should always stay in view. Use only photos the family approved."
                required: false
              - label: "More photos"
                name: "photos"
                widget: "list"
                label_singular: "photo"
                required: false
                summary: "{{fields.caption}}"
                hint: "Optional. Add as many extra photos as you like. They appear as a gallery in the story. Use only photos the family approved."
                fields:
                  - label: "Photo"
                    name: "photo"
                    widget: "focusimage"
                  - label: "Caption (optional)"
                    name: "caption"
                    widget: "string"
                    required: false
              - label: "News articles"
                name: "articles"
                widget: "list"
                required: false
                summary: "{{fields.outlet}} {{fields.url}}"
                hint: "Paste a link to each news article about this story. The headline, outlet and a short summary are filled in automatically about a minute after you publish. You can type a headline or outlet yourself to override them."
                fields:
                  - label: "Article link"
                    name: "url"
                    widget: "string"
                    hint: "Must start with https://"
                  - label: "Headline (optional)"
                    name: "title"
                    widget: "string"
                    required: false
                    hint: "Leave empty to use the article's own headline."
                  - label: "Outlet (optional)"
                    name: "outlet"
                    widget: "string"
                    required: false
                    hint: "For example Syracuse.com. Leave empty to fill in automatically."
                  - label: "Date (optional)"
                    name: "date"
                    widget: "datetime"
                    date_format: "YYYY-MM-DD"
                    time_format: false
                    format: "YYYY-MM-DD"
                    required: false
              - label: "Video (optional)"
                name: "video"
                widget: "string"
                required: false
                hint: "A YouTube or Vimeo link, for example a news clip. It plays right on the story when someone presses Watch. Other sites can't be embedded, so use News articles for those."
              - label: "Family consent and photo approval confirmed in writing"
                name: "approved"
                widget: "boolean"
                hint: "This must be ticked or the entry stays hidden, even if “Show on the site” is on."
                default: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: wednesdays
    label: "Why Wednesdays"
    description: "Weekly posts from E-Board members. A future date schedules the post: it appears on that day."
    files:
      - name: wednesdays
        label: "Why Wednesdays"
        file: content/wednesdays.json
        fields:
          - label: "Why Wednesday posts"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Written by"
                name: "author"
                widget: "string"
                hint: "Type the name exactly as it appears in Meet the team, so their photo shows."
              - label: "Wednesday it goes live"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Post"
                name: "body"
                widget: "text"
                hint: "Leave a blank line between paragraphs."
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: board
    label: "E-Board (Meet the team)"
    description: "Drag to reorder within each group. The Executive Director is shown full width, Directors in two columns, and everyone else in three columns under their team."
    files:
      - name: board
        label: "E-Board (Meet the team)"
        file: content/board.json
        fields:
          - label: "E-Board members"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} ({{fields.role}})"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Role"
                name: "role"
                widget: "string"
              - label: "Where they appear on the page"
                name: "tier"
                widget: "select"
                options:
                  - label: "Executive Director (full-width card at the top)"
                    value: "executive"
                  - label: "Director (two-column grid)"
                    value: "director"
                  - label: "Team member (three-column grid, grouped by team)"
                    value: "team"
                default: "team"
              - label: "Team"
                name: "team"
                widget: "string"
                hint: "For team members: the team they belong to, typed the same way for everyone on it, for example Finance Team. For a director: the team they lead, so that team appears under them. Leave empty for the Executive Director."
                required: false
              - label: "One-line intro"
                name: "bio"
                widget: "string"
                hint: "Optional short sentence under their role. Put an email in the Email field below instead."
                required: false
              - label: "Email"
                name: "email"
                widget: "string"
                hint: "Optional. Adds an email button to their card. The address itself is not shown."
                required: false
              - label: "Email button label"
                name: "emailLabel"
                widget: "string"
                hint: "Optional. Leave empty and the button says Email plus their first name, which updates on its own if you change their name. Type here to use your own words, for example Email Communications."
                required: false
              - label: "Donate link"
                name: "link"
                widget: "string"
                hint: "Optional. Paste the full web address (https://…). Adds a “Donate to …” button."
                required: false
              - label: "Photo"
                name: "photo"
                widget: "focusimage"
                hint: "Choose a photo, then drag the box that appears over the part that should always stay in view."
                required: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: true
  - name: events
    label: "Events"
    description: "Events you add by hand. OttoTHON events from the campus calendar are copied in automatically every day (you do not need to add those). To hide one of those, add it here with the same title and date and turn Show on the site off. Events move from Upcoming events to Where we’ve been on their own after their date."
    files:
      - name: events
        label: "Events"
        file: content/events.json
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Event name"
                name: "title"
                widget: "string"
              - label: "Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Type of event"
                name: "category"
                widget: "select"
                options:
                  - label: "Fundraiser (yellow)"
                    value: "fundraiser"
                  - label: "Meeting (blue)"
                    value: "meeting"
                  - label: "Social (pink)"
                    value: "social"
                  - label: "Community (green)"
                    value: "community"
                  - label: "Other (lavender)"
                    value: "other"
                default: "other"
                hint: "Sets the card color and icon."
              - label: "Time"
                name: "time"
                widget: "string"
                hint: "For example 7:00 PM – 8:00 PM. Used for the Add to Calendar button, so keep this format."
                required: false
              - label: "Place"
                name: "place"
                widget: "string"
                hint: "For example Schine Student Center, Room 304."
                required: false
              - label: "Description"
                name: "desc"
                widget: "text"
                hint: "For a past event, say what happened."
                required: false
              - label: "Related success stories"
                name: "stories"
                widget: "relation"
                collection: "stories"
                file: "stories"
                search_fields: ["items.*.title"]
                display_fields: ["items.*.title"]
                value_field: "items.*.title"
                multiple: true
                required: false
                hint: "Optional. Pick the success stories that came out of this event. The event card links to each story, and each story links back to the event. If you rename a story later, pick it again here."
              - label: "Photo or flyer"
                name: "photo"
                widget: "focusimage"
                hint: "Optional. Choose the photo, then drag the box over the part that should always stay in view. Use only photos you have permission to share."
                required: false
              - label: "Also show as a success story"
                name: "asStory"
                widget: "boolean"
                default: false
                required: false
                hint: "When on (and the family consent box below is ticked), this event also appears among the success stories on the Wall of Miracles: its name, what happened, its photos and the reflection."
              - label: "Family consent and photo approval confirmed in writing"
                name: "approved"
                widget: "boolean"
                default: false
                required: false
                hint: "Tick this only when everyone pictured, and the families of any children, has approved sharing the photos and story. The event does not appear as a success story until this is ticked."
              - label: "Reflection"
                name: "reflection"
                widget: "text"
                required: false
                hint: "Optional. A short personal note on what the event meant, in your own words. It shows in the story as A reflection."
              - label: "Reflection written by"
                name: "reflectionBy"
                widget: "string"
                required: false
                hint: "For example Carly, Executive Director."
              - label: "Story photos"
                name: "photos"
                widget: "list"
                label_singular: "photo"
                required: false
                summary: "{{fields.caption}}"
                hint: "Optional. Add as many photos as you like for the story. The main photo above is used as its cover."
                fields:
                  - label: "Photo"
                    name: "photo"
                    widget: "focusimage"
                  - label: "Caption (optional)"
                    name: "caption"
                    widget: "string"
                    required: false
              - label: "News articles"
                name: "articles"
                widget: "list"
                label_singular: "article"
                required: false
                summary: "{{fields.outlet}} {{fields.url}}"
                hint: "Optional. Paste a link to each news article about this event, as many as you like. The headline, outlet and a short summary are filled in automatically about a minute after you publish. If the event is also shown as a success story, the articles appear there too."
                fields:
                  - label: "Article link"
                    name: "url"
                    widget: "string"
                    hint: "Must start with https://"
                  - label: "Headline (optional)"
                    name: "title"
                    widget: "string"
                    required: false
                    hint: "Leave empty to use the article's own headline."
                  - label: "Outlet (optional)"
                    name: "outlet"
                    widget: "string"
                    required: false
                    hint: "For example Syracuse.com. Leave empty to fill in automatically."
                  - label: "Date (optional)"
                    name: "date"
                    widget: "datetime"
                    date_format: "YYYY-MM-DD"
                    time_format: false
                    format: "YYYY-MM-DD"
                    required: false
              - label: "Show as the big Next up ticket"
                name: "featured"
                widget: "boolean"
                default: false
                hint: "Pin this event as the big ticket at the top, for example the main event. If none is pinned, the soonest event is used."
                required: false
              - label: "Details link"
                name: "link"
                widget: "string"
                hint: "Optional. Full web address (https://…)."
                required: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: past-events
    label: "Past events"
    description: "Add events that already happened, with a photo and a short recap. They appear under Where we’ve been on the Events page, newest first and grouped by year. You do not need to move events here: events added under Events move to Where we’ve been by themselves after their date."
    files:
      - name: past-events
        label: "Past events"
        file: content/past-events.json
        fields:
          - label: "Past events"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - label: "Event name"
                name: "title"
                widget: "string"
              - label: "Date it happened"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Type of event"
                name: "category"
                widget: "select"
                options:
                  - label: "Fundraiser (yellow)"
                    value: "fundraiser"
                  - label: "Meeting (blue)"
                    value: "meeting"
                  - label: "Social (pink)"
                    value: "social"
                  - label: "Community (green)"
                    value: "community"
                  - label: "Other (lavender)"
                    value: "other"
                default: "other"
                hint: "Sets the card color and icon."
              - label: "Place"
                name: "place"
                widget: "string"
                required: false
              - label: "What happened"
                name: "desc"
                widget: "text"
                hint: "A sentence or two: who came, what you did, what it meant. Long recaps get a Read more link."
                required: false
              - label: "Related success stories"
                name: "stories"
                widget: "relation"
                collection: "stories"
                file: "stories"
                search_fields: ["items.*.title"]
                display_fields: ["items.*.title"]
                value_field: "items.*.title"
                multiple: true
                required: false
                hint: "Optional. Pick the success stories that came out of this event. The event card links to each story, and each story links back to the event. If you rename a story later, pick it again here."
              - label: "Photo"
                name: "photo"
                widget: "focusimage"
                hint: "Optional. Choose the photo, then drag the box over the part that should always stay in view. Use only photos you have permission to share."
                required: false
              - label: "Also show as a success story"
                name: "asStory"
                widget: "boolean"
                default: false
                required: false
                hint: "When on (and the family consent box below is ticked), this event also appears among the success stories on the Wall of Miracles: its name, what happened, its photos and the reflection."
              - label: "Family consent and photo approval confirmed in writing"
                name: "approved"
                widget: "boolean"
                default: false
                required: false
                hint: "Tick this only when everyone pictured, and the families of any children, has approved sharing the photos and story. The event does not appear as a success story until this is ticked."
              - label: "Reflection"
                name: "reflection"
                widget: "text"
                required: false
                hint: "Optional. A short personal note on what the event meant, in your own words. It shows in the story as A reflection."
              - label: "Reflection written by"
                name: "reflectionBy"
                widget: "string"
                required: false
                hint: "For example Carly, Executive Director."
              - label: "Story photos"
                name: "photos"
                widget: "list"
                label_singular: "photo"
                required: false
                summary: "{{fields.caption}}"
                hint: "Optional. Add as many photos as you like for the story. The main photo above is used as its cover."
                fields:
                  - label: "Photo"
                    name: "photo"
                    widget: "focusimage"
                  - label: "Caption (optional)"
                    name: "caption"
                    widget: "string"
                    required: false
              - label: "News articles"
                name: "articles"
                widget: "list"
                label_singular: "article"
                required: false
                summary: "{{fields.outlet}} {{fields.url}}"
                hint: "Optional. Paste a link to each news article about this event, as many as you like. The headline, outlet and a short summary are filled in automatically about a minute after you publish. If the event is also shown as a success story, the articles appear there too."
                fields:
                  - label: "Article link"
                    name: "url"
                    widget: "string"
                    hint: "Must start with https://"
                  - label: "Headline (optional)"
                    name: "title"
                    widget: "string"
                    required: false
                    hint: "Leave empty to use the article's own headline."
                  - label: "Outlet (optional)"
                    name: "outlet"
                    widget: "string"
                    required: false
                    hint: "For example Syracuse.com. Leave empty to fill in automatically."
                  - label: "Date (optional)"
                    name: "date"
                    widget: "datetime"
                    date_format: "YYYY-MM-DD"
                    time_format: false
                    format: "YYYY-MM-DD"
                    required: false
              - label: "Link"
                name: "link"
                widget: "string"
                hint: "Optional. A full web address (https://…) for photos, a recap post, or more details."
                required: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: ways
    label: "Ways to help"
    description: "The cards at the top of Get involved. A button stays hidden until it has a link."
    files:
      - name: ways
        label: "Ways to help"
        file: content/ways.json
        fields:
          - label: "Ways to help"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "desc"
                widget: "text"
                required: false
              - label: "Button label"
                name: "label"
                widget: "string"
                hint: "For example Register, Apply, or Donate."
                required: false
              - label: "Button link"
                name: "link"
                widget: "string"
                hint: "Full web address (https://…)."
                required: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: true
  - name: faq
    label: "FAQ"
    description: "A question stays hidden until it has an answer and “Show on the site” is on."
    files:
      - name: faq
        label: "FAQ"
        file: content/faq.json
        fields:
          - label: "Questions"
            name: "items"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - label: "Question"
                name: "question"
                widget: "string"
              - label: "Answer"
                name: "answer"
                widget: "text"
                required: false
              - label: "Show on the site"
                name: "published"
                widget: "boolean"
                hint: "Turn off to hide this without deleting it."
                default: false
  - name: settings
    label: "Words, links and appearance"
    description: "Every sentence on the site that is not a story, profile, post, or event; the donate and register links; and the color theme."
    files:
      - name: settings
        label: "Words, links and appearance"
        file: content/settings.json
        fields:
          - label: "Links and contact"
            name: "links"
            widget: "object"
            fields:
              - label: "Donate link"
                name: "donateUrl"
                widget: "string"
                hint: "Full web address (https://…). The Donate buttons stay hidden until this is filled in."
                required: false
              - label: "Register link (teams and marathon day)"
                name: "registerUrl"
                widget: "string"
                hint: "Full web address (https://…)."
                required: false
              - label: "Upstate Golisano Children’s Hospital link"
                name: "hospitalUrl"
                widget: "string"
                required: false
                hint: "Where the hospital's logo and name link to. Leave empty to use the hospital's own site (https://www.upstate.edu/gch/). Type none to turn these links off."
              - label: "Contact email"
                name: "email"
                widget: "string"
          - label: "Home page photos"
            name: "photos"
            widget: "object"
            fields:
              - label: "Home page photo (marathon day)"
                name: "heroPhoto"
                widget: "image"
                hint: "Use only photos you have permission to share."
                required: false
              - label: "Wall of Miracles banner photo"
                name: "wallPhoto"
                widget: "image"
                hint: "If empty, the site uses a Miracle Kid photo when one has been published."
                required: false
          - label: "Home page"
            name: "home"
            widget: "object"
            fields:
              - label: "Title"
                name: "homeTitle"
                widget: "string"
              - label: "Subtitle"
                name: "homeKicker"
                widget: "string"
              - label: "Intro"
                name: "homeIntro"
                widget: "text"
              - label: "Photo caption"
                name: "homeCaption"
                widget: "string"
              - label: "Mission headline"
                name: "missionTitle"
                widget: "string"
              - label: "Mission text"
                name: "missionBody"
                widget: "text"
              - label: "Total reveal note"
                name: "revealNote"
                widget: "text"
                required: false
              - label: "Wall of Miracles banner: quote"
                name: "wallQuote"
                widget: "string"
              - label: "Wall of Miracles banner: title"
                name: "wallTitle"
                widget: "string"
              - label: "Wall of Miracles banner: text"
                name: "wallBody"
                widget: "text"
              - label: "Upcoming events title"
                name: "upcomingTitle"
                widget: "string"
              - label: "Upcoming events intro"
                name: "upcomingIntro"
                widget: "text"
          - label: "Home page numbers"
            name: "stats"
            widget: "list"
            hint: "A number left blank is hidden. Do not add this year’s dollar total until reveal day."
            summary: "{{fields.n}} {{fields.l}}"
            fields:
              - label: "Number"
                name: "n"
                widget: "string"
                required: false
              - label: "Label"
                name: "l"
                widget: "string"
          - label: "Wall of Miracles page"
            name: "wall"
            widget: "object"
            fields:
              - label: "Page title"
                name: "heroTitle"
                widget: "string"
              - label: "Page subtitle"
                name: "heroSub"
                widget: "text"
              - label: "Success stories intro"
                name: "storiesIntro"
                widget: "text"
              - label: "Why Wednesdays intro"
                name: "wedIntro"
                widget: "text"
              - label: "“Why they do it” list"
                name: "whyList"
                widget: "text"
                hint: "One per line."
              - label: "Impact title"
                name: "impactTitle"
                widget: "string"
              - label: "Impact intro"
                name: "impactIntro"
                widget: "text"
          - label: "Wall of Miracles impact numbers"
